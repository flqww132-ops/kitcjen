<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#FBEFE3">
  <title>Книга кухни</title>
  <script>
    // Тема — сразу, до отрисовки, чтобы не мигало
    (function () {
      var m = 'light';
      try { m = localStorage.getItem('kb_theme') || 'light'; } catch (e) {}
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.className = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232481cc'/%3E%3Cpath d='M10 7v8a3 3 0 0 0 2 2.8V25h2v-7.2A3 3 0 0 0 16 15V7h-1.5v6h-1V7h-1v6h-1V7zM20 7c-1.7 1.5-2.5 4-2.5 7v3H20v8h2V7z' fill='%23fff'/%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
  <link rel="stylesheet" href="css/app.css?v=1.6.0">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="navBack" class="icon-btn" hidden aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="title">Книга кухни</h1>
      <div id="topActions"></div>
      <span id="syncDot" class="sync-dot"></span>
    </header>
    <main id="screen"><div class="empty"><div class="spinner"></div></div></main>
    <nav id="tabbar">
      <button data-tab="ttk"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 10h7M9 14h7M9 18h4"/></svg><span>ТТК</span></button>
      <button data-tab="prep"><svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg><span>Заготовки</span></button>
      <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5zM3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg><span>Склад</span></button>
      <button data-tab="shift"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5.5H5.5V21h13V5.5H17M8.5 12l2 2 4-4M8.5 17h7"/></svg><span>Смена</span></button>

    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast"></div>
