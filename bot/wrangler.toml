# Бот-напоминальщик «Книги кухни» (Cloudflare Workers, бесплатный тариф).
# Ключ бота задаётся секретом BOT_TOKEN в настройках Cloudflare — в репозиторий он не попадает.
name = "kniga-kuhni-bot"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
# Не стирать переменные, добавленные в панели Cloudflare, при каждой сборке
keep_vars = true

[[durable_objects.bindings]]
name = "SCHEDULER"
class_name = "Scheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scheduler"]

# Раз в 5 минут — проверить, не вышла ли новая версия приложения (сообщение «что нового»)
[triggers]
crons = ["*/5 * * * *"]
